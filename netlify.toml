# A app está na pasta terrenos/ (index.html, PWA, _redirects).
# Sem isto, o Netlify publica a raiz do GitHub (só README.md) e o site dá 404.

[build]
  publish = "terrenos"

# Proxies same-origin (HTTPS): o browser não fala diretamente com a DGT (CORS / mixed content).

[[redirects]]
  from = "/snic/*"
  to = "https://snic.dgterritorio.gov.pt/geoportal/dgt_snic2/api/app/search/cgpr/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/snicp/*"
  to = "https://snic.dgterritorio.gov.pt/geoportal/dgt_snic2/api/app/search/predio/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/ogc/*"
  to = "https://ogcapi.dgterritorio.gov.pt/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/snicws"
  to = "https://snicws.dgterritorio.gov.pt/geoserver/inspire/ows"
  status = 200
  force = true

[[redirects]]
  from = "/snicws/*"
  to = "https://snicws.dgterritorio.gov.pt/geoserver/inspire/ows/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/nominatim/*"
  to = "https://nominatim.openstreetmap.org/:splat"
  status = 200
  force = true
