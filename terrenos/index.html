});

/* ========================================================
   GEOLOCALIZAÇÃO
   ======================================================== */
let meMarker=null, meCircle=null;
function locate(silent) {
  if (!navigator.geolocation) { if(!silent) toast('Dispositivo não suporta geolocalização.'); return; }
  if (!silent) toast('📡 A obter localização…');
  navigator.geolocation.getCurrentPosition(
    pos => {
      userPos = L.latLng(pos.coords.latitude, pos.coords.longitude);
      if (!PT_BOUNDS.contains(userPos)) { if(!silent) toast('Fora de Portugal continental.'); return; }
      if (meMarker) { meMarker.setLatLng(userPos); meCircle.setLatLng(userPos).setRadius(pos.coords.accuracy); }
      else {
        meCircle = L.circle(userPos, { radius:pos.coords.accuracy, color:'#2563eb', weight:1, fillOpacity:.12 }).addTo(map);
        meMarker = L.circleMarker(userPos, { radius:8, color:'#fff', weight:3, fillColor:'#2563eb', fillOpacity:1 }).addTo(map);
      }
      if (!silent || !props.length) map.setView(userPos, Math.max(map.getZoom(),15));
      renderList();
    },
    err => {
      if (silent) return;
      toast(err.code===1 ? 'Localização bloqueada nas definições do browser.' : 'Não foi possível obter a localização.');
    },
    { enableHighAccuracy:true, timeout:15000, maximumAge:5000 }
  );
}
document.getElementById('btnLocate').onclick = () => locate(false);
locate(true);

/* ========================================================
   VÉRTICES DO TERRENO – marcadores V1, V2, … no mapa + lista de coordenadas
   A numeração da lista e a dos marcadores vêm do MESMO array (vtxState.items),
   por isso o "V3" do painel é sempre o "V3" que se vê no mapa.
   ======================================================== */
const vtxLayer = L.layerGroup().addTo(map);
let vtxState = null;     // { id, name, items:[{ n, ll, marker, grupo }] }

/* getLatLngs() devolve níveis diferentes (polígono simples / com buracos / multipolígono).
   Normaliza para: lista de partes; cada parte = [contorno, buraco, buraco…] */
function polygonParts(ll) {
  if (!ll || !ll.length) return [];
  if (ll[0] instanceof L.LatLng) return [[ll]];
  if (ll[0][0] instanceof L.LatLng) return [ll];
  return ll.flatMap(polygonParts);
}
function polygonLayersOf(layer, out = []) {
  if (layer instanceof L.Polyline) out.push(layer);        // inclui polígonos (L.Polygon herda de L.Polyline) e linhas
  else if (layer.eachLayer) layer.eachLayer(l => polygonLayersOf(l, out));
  return out;
}
const sameLL = (a, b) => a.lat === b.lat && a.lng === b.lng;

/* Constrói a lista numerada de vértices (V1…Vn, contínua em todas as partes do terreno) */
function buildVertices(layer) {
  const linePartsOf = ll => ll[0] instanceof L.LatLng ? [[ll]] : ll.map(seg => [seg]);
  const parts = polygonLayersOf(layer).flatMap(pl => pl instanceof L.Polygon
    ? polygonParts(pl.getLatLngs()).map(rings => ({ rings, poly: true }))
    : linePartsOf(pl.getLatLngs()).map(rings => ({ rings, poly: false })));
  const items = []; let n = 0;
  parts.forEach((part, pi) => part.rings.forEach((ring, ri) => {
    const pts = part.poly && ring.length > 1 && sameLL(ring[0], ring[ring.length - 1]) ? ring.slice(0, -1) : ring;   // polígonos: sem o ponto de fecho repetido
    const grupo = (parts.length > 1 ? `${part.poly ? 'Parcela' : 'Troço'} ${pi + 1}` : '') + (ri > 0 ? (parts.length > 1 ? ' – ' : '') + `Buraco ${ri}` : '');
    pts.forEach(ll => items.push({ n: ++n, ll, grupo }));
  }));
  return items;
}

const fmtLL = v => v.toFixed(6);                       // 6 casas ≈ 0,1 m
const fmtTM = ll => { const [m, p] = toTM06(ll.lng, ll.lat); return { m: m.toFixed(2), p: p.toFixed(2) }; };

function vertexIcon(n, sel) {
  return L.divIcon({ className: 'vtx' + (sel ? ' sel' : ''), iconSize: [0, 0], iconAnchor: [0, 0],
                     html: `<span class="vtx-dot"></span><span class="vtx-lbl">V${n}</span>` });
}

function showVertices(id) {
  clearVertices();
  const layer = layersById[id], p = props.find(x => x.id === id);
  if (!layer || !p) return;
  const items = buildVertices(layer);
  if (!items.length) return toast('Este terreno não tem vértices para mostrar.');

  // marcadores numerados, exatamente em cima de cada vértice
  items.forEach(it => {
    it.marker = L.marker(it.ll, { icon: vertexIcon(it.n), keyboard: false, zIndexOffset: 1000 })
      .on('click', e => { L.DomEvent.stopPropagation(e); selectVertex(it.n, false); })
      .addTo(vtxLayer);
  });
  vtxState = { id, name: p.name, items, sel: null };

  // painel inferior com a lista (mesma numeração)
  let ultimoGrupo = null;
  el('vtxList').innerHTML = items.map(it => {
    const head = it.grupo !== ultimoGrupo && it.grupo ? `<li class="vtx-head">${esc(it.grupo)}</li>` : '';
    ultimoGrupo = it.grupo;
    const tm = fmtTM(it.ll);
    return head + `<li class="vtx-row" data-n="${it.n}">
      <span class="vtx-badge">V${it.n}</span>
      <div class="vtx-coords"><b>Lat: ${fmtLL(it.ll.lat)}</b><b>Lng: ${fmtLL(it.ll.lng)}</b>
        <small>PT-TM06: M ${tm.m} · P ${tm.p}</small></div>
    </li>`;
  }).join('');
  el('vtxTitle').textContent = `Vértices · ${p.name}`;
  el('vtxInfo').textContent = `${items.length} vértices, ${p.isLine ? 'pela ordem do traçado' : 'pela ordem do contorno'}. Toque num vértice (no mapa ou na lista) para o localizar.`;
  document.body.classList.add('vtx-open');
  el('vtxPanel').classList.add('open');

  // centra o terreno na parte do mapa que fica acima do painel
  const h = el('vtxPanel').offsetHeight;
  map.fitBounds(layer.getBounds(), { paddingTopLeft: [36, 70], paddingBottomRight: [36, h + 24], maxZoom: 19 });
}

function selectVertex(n, centrar = true) {
  if (!vtxState) return;
  vtxState.items.forEach(it => it.marker.setIcon(vertexIcon(it.n, it.n === n)));
  const it = vtxState.items.find(x => x.n === n); if (!it) return;
  it.marker.setZIndexOffset(3000);
  vtxState.sel = n;
  document.querySelectorAll('#vtxList .vtx-row').forEach(r => r.classList.toggle('sel', +r.dataset.n === n));
  const row = document.querySelector(`#vtxList .vtx-row[data-n="${n}"]`);
  if (row) row.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  if (centrar) {   // põe o vértice na parte visível do mapa, acima do painel
    const z = map.getZoom(), pt = map.project(it.ll, z).add([0, el('vtxPanel').offsetHeight / 2]);
    map.panTo(map.unproject(pt, z));
  }
}

function clearVertices() {
  vtxLayer.clearLayers();
  vtxState = null;
  document.body.classList.remove('vtx-open');
  const panel = el('vtxPanel'); if (panel) panel.classList.remove('open');
}

function copyVertices() {
  if (!vtxState) return;
  const txt = `${vtxState.name}\n` + vtxState.items.map(it => {
    const tm = fmtTM(it.ll);
    return `V${it.n} - Lat: ${fmtLL(it.ll.lat)}, Lng: ${fmtLL(it.ll.lng)} (PT-TM06 M ${tm.m}, P ${tm.p})`;
  }).join('\n');
  const ok = () => toast('Coordenadas copiadas');
  const fallback = () => {
    const ta = document.createElement('textarea'); ta.value = txt; ta.style.cssText = 'position:fixed;opacity:0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); ok(); } catch (_) { toast('Não foi possível copiar.'); }
    ta.remove();
  };
  navigator.clipboard ? navigator.clipboard.writeText(txt).then(ok, fallback) : fallback();
}

el('vtxList').addEventListener('click', e => { const r = e.target.closest('.vtx-row'); if (r) selectVertex(+r.dataset.n, true); });
el('vtxClose').onclick = clearVertices;
el('vtxCopy').onclick  = copyVertices;

/* ========================================================
   IDENTIFICAR UM PRÉDIO DA MALHA DGT (só consulta – NUNCA grava)
   Com "Cadastro DGT (WMS)" ativo, tocar num sítio sem propriedade guardada consulta a OGC API da DGT
   (prédios que intersectam o ponto) e mostra Concelho, Freguesia, Secção, Prédio e NIC numa caixa.
   ======================================================== */
const identLayer = L.layerGroup().addTo(map);   // destaque temporário (não é uma propriedade guardada)
let identTip = null, identToken = 0;

function ringHas(ring, x, y) {
  let dentro = false;
  for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) {
    const [xi, yi] = ring[i], [xj, yj] = ring[j];
    if ((yi > y) !== (yj > y) && x < (xj - xi) * (y - yi) / (yj - yi) + xi) dentro = !dentro;
  }
  return dentro;
}
function geomHas(geo, ll) {
  const polys = geo.type === 'Polygon' ? [geo.coordinates] : geo.type === 'MultiPolygon' ? geo.coordinates : [];
  return polys.some(r => ringHas(r[0], ll.lng, ll.lat) && !r.slice(1).some(h => ringHas(h, ll.lng, ll.lat)));
}

/* ── Acesso de SÓ LEITURA à DGT para identificar prédios ───────────────────────────
   Duas vias independentes, em paralelo (ganha a primeira que devolver o prédio):
     OGC  = OGC API da DGT (coleção "cadastro", filtro bbox)
     WMS  = GetFeatureInfo da camada "cadastralparcel" (GeoServer da DGT; consulta por ponto)
   Cada via tenta: 1) proxy do próprio site (/ogc, /snicws)  2) proxy público (allorigins).
   NADA daqui grava dados: não há storeProperty, nem props.push, nem localStorage. */
class OgcErro extends Error { constructor(msg, status) { super(msg); this.status = status; } }
let ogcColecao = CONFIG.OGC_COLLECTION;       // só em memória
let ogcDescobriu = false;
let ultimoDiag = [];                          // passos da última identificação (para diagnóstico em Definições)
const diagAdd = (rota, via, estado) => ultimoDiag.push(`${rota} ${via}: ${estado}`);

/* Pedido resiliente: só caminhos relativos (proxy) e, se falhar, allorigins com URL absoluto HTTPS. */
async function pedidoResiliente(rota, local, sinal, urlAbs, publicoEm404 = true) {
  let ultimo = null;
  try {
    const res = await fetch(local, { headers: { Accept: 'application/geo+json, application/json' }, signal: sinal || AbortSignal.timeout(15000) });
    if (!eProxyLocal(res)) { diagAdd(rota, 'proxy-local', 'inexistente'); ultimo = new OgcErro('HTTP ' + res.status, res.status); }
    else if (res.ok) { diagAdd(rota, 'proxy-local', 'ok'); return res; }
    else {
      diagAdd(rota, 'proxy-local', `HTTP ${res.status}`);
      ultimo = new OgcErro(`HTTP ${res.status}`, res.status);
      if (res.status === 400) throw ultimo;
    }
  } catch (err) {
    if (err.name === 'AbortError' || err instanceof OgcErro) throw err;
    diagAdd(rota, 'proxy-local', 'sem resposta (rede/CORS)');
    ultimo = ultimo || new OgcErro('sem ligação', 0);
  }
  const s = ultimo ? ultimo.status : 0;
  if (CONFIG.PROXY_PUBLICO && urlAbs && (s === 0 || s === 403 || s >= 500 || (s === 404 && publicoEm404))) {
    try {
      const res = await fetch(CONFIG.PROXY_PUBLICO + encodeURIComponent(urlAbs), { signal: sinal || AbortSignal.timeout(20000) });
      diagAdd(rota, 'público', res.ok ? 'ok' : `HTTP ${res.status}`);
      if (res.ok) return res;
      if (res.status === 404) ultimo = new OgcErro('HTTP 404', 404);
    } catch (err) { if (err.name === 'AbortError') throw err; diagAdd(rota, 'público', 'sem resposta'); }
  }
  throw ultimo || new OgcErro('sem ligação', 0);
}

/* O corpo tem de ser mesmo GeoJSON de prédios. Se vier outra coisa (página de erro, aviso do proxy…) não é "sem dados": é falha. */
async function lerFeatures(res, rota) {
  let txt = '';
  try { txt = await res.text(); } catch (_) {}
  let d = null;
  try { d = JSON.parse(txt); } catch (_) { /* pode vir embrulhado por um proxy */ }
  if (d && typeof d.contents === 'string') { try { d = JSON.parse(d.contents); } catch (_) {} }     // formato "get" do allorigins
  if (d && (d.code === 'NotFound' || d.type === 'NotFound')) throw new OgcErro('não existe', 404);
  if (!d || !Array.isArray(d.features)) { diagAdd(rota, 'resposta', 'não é GeoJSON'); throw new OgcErro('resposta inválida', 502); }
  return d.features.filter(f => f && f.geometry).map(ensureWGS84);
}

/* bbox no formato exigido pela OGC API: minLng,minLat,maxLng,maxLat (graus, CRS84) */
function bboxStr(lng1, lat1, lng2, lat2) {
  const v = [lng1, lat1, lng2, lat2].map(Number);
  if (v.some(x => !isFinite(x))) throw new OgcErro('bbox inválida', 400);
  const [w, e] = [Math.min(v[0], v[2]), Math.max(v[0], v[2])], [s, n] = [Math.min(v[1], v[3]), Math.max(v[1], v[3])];
  return [w, s, e, n].map(x => x.toFixed(7)).join(',');
}

async function ogcColecoesAlternativas(tentadas, sinal) {      // lê /collections e devolve ids que pareçam ser o cadastro
  try {
    const qs = new URLSearchParams({ f: 'json' });
    const res = await pedidoResiliente('OGC', `${CONFIG.OGC_BASE}/collections?${qs}`, sinal, `${DGT_ABS.ogc}/collections?${qs}`, false);
    const d = JSON.parse(await res.text());
    return (d.collections || []).map(c => String(c.id)).filter(id => /cadastr/i.test(id) && !tentadas.includes(id));
  } catch (_) { return []; }
}

/* Prédios da OGC API que intersectam uma caixa, em GeoJSON lon/lat */
async function ogcBBox(bbox, limit, sinal) {
  const tentadas = [];
  const colecoes = [ogcColecao, CONFIG.OGC_COLLECTION, 'CP.CadastralParcel', 'cp.cadastralparcel'].filter((c, i, a) => a.indexOf(c) === i);
  for (let i = 0; i < colecoes.length; i++) {
    const col = colecoes[i]; tentadas.push(col);
    for (const extra of [{ crs: CONFIG.CRS84 }, {}]) {          // se a API recusar o parâmetro crs (400), repete sem ele
      const qs = new URLSearchParams({ f: 'json', limit, bbox, ...extra });
      try {
        const res = await pedidoResiliente('OGC', `${CONFIG.OGC_BASE}/collections/${col}/items?${qs}`, sinal, `${DGT_ABS.ogc}/collections/${col}/items?${qs}`, i === 0);
        const feats = await lerFeatures(res, 'OGC');
        ogcColecao = col;                                          // memória da sessão (não grava nada)
        return feats;
      } catch (err) {
        if (err.name === 'AbortError') throw err;
        if (err.status === 400) continue;                          // tenta sem crs
        if (err.status === 404) break;                             // esta coleção não existe: passa à seguinte
        throw err;                                                 // rede / erro do servidor / resposta inválida
      }
    }
    if (i === colecoes.length - 1 && !ogcDescobriu) { ogcDescobriu = true; colecoes.push(...await ogcColecoesAlternativas(tentadas, sinal)); }   // descobrir o id real
  }
  throw new OgcErro('sem dados', 404);
}

const MSG_SEM_DADOS = 'Sem dados oficiais de cadastro neste local';
const metrosPorPx = () => 156543.03392804097 / 2 ** map.getZoom();      // Web Mercator, metros por píxel

/* Via OGC: prédio que contém o ponto tocado */
async function fetchParcelAt(ll, sinal) {
  const k = Math.cos(ll.lat * Math.PI / 180);
  const r = Math.max(1.5, metrosPorPx() * k * 6);                        // ≈ 6 px de tolerância ao toque (metros no terreno)
  const dLat = r / 111320, dLng = r / (111320 * k);
  const feats = await ogcBBox(bboxStr(ll.lng - dLng, ll.lat - dLat, ll.lng + dLng, ll.lat + dLat), 25, sinal);
  return feats.find(f => geomHas(f.geometry, ll)) || null;
}

/* Via WMS: GetFeatureInfo (consulta por ponto) na camada do cadastro */
async function rotaWMS(ll, sinal) {
  const W = 101, H = 101, res = metrosPorPx(), c = L.CRS.EPSG3857.project(ll);     // janela 101x101 px centrada no toque
  const bbox = [c.x - res * W / 2, c.y - res * H / 2, c.x + res * W / 2, c.y + res * H / 2].map(v => v.toFixed(3)).join(',');
  const qs = new URLSearchParams({ service: 'WMS', version: '1.3.0', request: 'GetFeatureInfo', layers: CONFIG.DGT_WMS_LAYER,
    query_layers: CONFIG.DGT_WMS_LAYER, styles: '', format: 'image/png', crs: 'EPSG:3857', bbox, width: W, height: H,
    i: (W - 1) / 2, j: (H - 1) / 2, info_format: 'application/json', feature_count: 5, buffer: 8 });
  const resp = await pedidoResiliente('WMS', `${CONFIG.DGT_WMS_URL}?${qs}`, sinal, `${DGT_ABS.wms}?${qs}`, false);
  const feats = await lerFeatures(resp, 'WMS');
  return feats.find(f => geomHas(f.geometry, ll)) || feats[0] || null;
}

/* Corre as duas vias em paralelo; devolve o 1.º prédio encontrado. Se uma via responder "vazio", a outra tem 4 s de tolerância. */
function identificarParcela(ll) {
  ultimoDiag = [];
  const ctl = new AbortController(), parar = setTimeout(() => ctl.abort(), 28000);
  const vias = { OGC: fetchParcelAt(ll, ctl.signal), WMS: rotaWMS(ll, ctl.signal) };
  const resp = {};
  return new Promise(resolve => {
    let falta = Object.keys(vias).length, tolerancia = null;
    const fim = feat => { clearTimeout(parar); clearTimeout(tolerancia); ctl.abort(); resolve({ feat, resp }); };
    Object.entries(vias).forEach(([nome, p]) => p.then(
      v => { resp[nome] = { v }; if (v) fim(v); else if (!tolerancia) tolerancia = setTimeout(() => fim(null), 4000); },
      e => { resp[nome] = { e }; }
    ).finally(() => { if (--falta === 0) fim(resp.OGC?.v || resp.WMS?.v || null); }));
  });
}

/* Malha vetorial (alternativa ao WMS): só contornos amarelos finos, interior inexistente. Carrega a zona visível (zoom ≥ 16). */
const vetRenderer = L.canvas({ padding: .3 });
async function desenharMalhaVet() {
  if (!map.hasLayer(malhaVet)) return;
  if (map.getZoom() < 16) {
    if (vetBox) { malhaVet.clearLayers(); vetBox = null; }
    return toast('Aproxime o mapa (zoom 16 ou mais) para ver as linhas do cadastro.');
  }
  const vista = map.getBounds();
  if (vetBox && vetBox.contains(vista)) return;                  // esta zona já está desenhada
  const area = vista.pad(0.5);
  if (vetAbort) vetAbort.abort();
  vetAbort = new AbortController();
  try {
    const feats = await ogcBBox(bboxStr(area.getWest(), area.getSouth(), area.getEast(), area.getNorth()), 1000, vetAbort.signal);
    malhaVet.clearLayers();
    L.geoJSON({ type: 'FeatureCollection', features: feats }, {
      style: () => ({ color: AMARELO, weight: 1.2, opacity: 1, fill: false }),   // sem preenchimento
      renderer: vetRenderer, interactive: false }).addTo(malhaVet);
    vetBox = area;
    if (feats.length >= 1000) toast('Zona muito densa: aproxime mais para ver todas as estremas.');
  } catch (err) {
    if (err.name === 'AbortError') return;
    console.warn('Malha vetorial:', err);
    toast(err.status === 404 ? MSG_SEM_DADOS : 'Não foi possível carregar as linhas do cadastro agora.');
  }
}

/* Extrai identificação dos atributos devolvidos (NIC, freguesia e, se existirem, secção/prédio) */
function parcelInfo(raw) {
  const p = {}; for (const [k, v] of Object.entries(raw || {})) p[k.toLowerCase()] = v;          // nomes em minúsculas (o servidor pode usar camelCase)
  const info = { nic: String(p.nationalcadastralreference || p.nic || '').trim(), dicofre: '', sec: '', pre: '' };
  info.dicofre = (String(p.administrativeunit ?? p.dicofre ?? '').match(/\d{6}/) || [''])[0];
  for (const v of Object.values(p)) {                            // "freguesia_secção_prédio" (ex.: 050223_BQ_66) em qualquer campo
    const m = typeof v === 'string' && v.trim().match(/^(\d{6})_([A-Za-z0-9]+)_(\d+)$/);
    if (m) { info.dicofre ||= m[1]; info.sec = m[2].toUpperCase(); info.pre = stripZeros(m[3]); }
  }
  if (!info.sec) {
    const ks = Object.keys(p).find(k => /^(seccao|secção|section|sec)$/.test(k));
    const kp = Object.keys(p).find(k => /^(numeropredio|numero_predio|n_?predio|predio|numpredio|prd)$/.test(k));
    if (ks && kp && p[ks] && p[kp]) { info.sec = String(p[ks]).toUpperCase(); info.pre = stripZeros(p[kp]); }
  }
  return info;
}
/* Tentativa extra: o SNIC pode devolver a secção/prédio a partir do NIC (endereço presumido; se não existir, é ignorado) */
async function secPreByNic(nic) {
  const n = nic.replace(/\s/g, ''); if (!n) return null;
  try {
    const d = await snicGet('nic', { filter: n }, true);
    const obj = Array.isArray(d) ? d.find(x => String(x?.nic || '').replace(/\s/g, '') === n) : d;
    const m = obj && String(obj.nic || '').replace(/\s/g, '') === n && String(obj.id_cadastro || '').match(/^(\d{6})_([A-Za-z0-9]+)_(\d+)$/);
    return m ? { dicofre: m[1], sec: m[2].toUpperCase(), pre: stripZeros(m[3]) } : null;
  } catch (_) { return null; }
}

function identHTML(info, areaM2) {
  const d = info.dicofre, d4 = d.slice(0, 4);
  const freg = d ? (FREGUESIAS_LOCAL[d4] || []).find(([c]) => c === d) : null;
  const row = (k, v) => `<div><span>${k}</span> ${v ? esc(v) : '—'}</div>`;
  return `<strong>Prédio · só consulta</strong>` + row('Concelho:', d ? MUNICIPIOS_LOCAL[d4] : '') + row('Freguesia:', freg ? freg[1] : '')
    + row('Secção:', info.sec) + row('Prédio:', info.pre) + row('NIC:', info.nic)
    + (areaM2 ? row('Área:', `${areaM2.toLocaleString('pt-PT')} m²`) : '')
    + `<em>${info.sec ? 'Não foi guardado.' : 'Secção/prédio indisponíveis nesta fonte. Não foi guardado.'}</em>`;
}
function showIdentTip(ll, html) {
  if (identTip) map.removeLayer(identTip);
  identTip = L.tooltip({ permanent: true, direction: 'top', className: 'cad-tip', opacity: 1, offset: [0, -6], interactive: false })
    .setLatLng(ll).setContent(html).addTo(map);
}
function clearIdentify() {
  identToken++; identLayer.clearLayers();
  if (identTip) { map.removeLayer(identTip); identTip = null; }
}
/* Texto pequeno com o resultado de cada via (ajuda a perceber falhas no telemóvel, onde não há consola) */
function diagResumo(resp) {
  const f = r => !r ? '—' : r.e ? (r.e.status ? `erro ${r.e.status}` : r.e.name === 'AbortError' ? 'cancelada' : 'sem resposta') : (r.v ? 'encontrou' : '0 prédios');
  return `OGC: ${f(resp.OGC)} · WMS: ${f(resp.WMS)}`;
}

/* IDENTIFICAR = SÓ CONSULTA. Mostra os dados numa tooltip temporária. NUNCA chama storeProperty, nem altera props/localStorage. */
async function identifyAt(ll) {
  const token = ++identToken;
  identLayer.clearLayers(); showIdentTip(ll, '<strong>A identificar…</strong>');
  try {
    const { feat, resp } = await identificarParcela(ll);
    if (token !== identToken) return;
    if (!feat) {
      console.warn('Identificação sem prédio:', diagResumo(resp), ultimoDiag);
      const vazio = Object.values(resp).some(r => r && 'v' in r) || Object.values(resp).some(r => r && r.e && r.e.status === 404);
      return showIdentTip(ll, (vazio ? `<strong>${MSG_SEM_DADOS}</strong>`
        : '<strong>Não foi possível consultar o cadastro agora</strong><div>Verifique a ligação e toque de novo.</div>') + `<em>${diagResumo(resp)}</em>`);
    }
    L.geoJSON(feat, { style: () => ({ ...SEL_STYLE }), interactive: false }).addTo(identLayer);   // realce temporário (camada à parte; nunca vai para a lista)
    const info = parcelInfo(feat.properties || {});
    if (!info.sec && info.nic) Object.assign(info, await secPreByNic(info.nic) || {});
    if (token !== identToken) return;
    showIdentTip(ll, identHTML(info, Math.round(geomAreaM2(feat.geometry))));
  } catch (err) {
    if (token !== identToken) return;
    console.warn('Identificação:', err, ultimoDiag);
    showIdentTip(ll, '<strong>Não foi possível consultar o cadastro agora</strong><div>Verifique a ligação e toque de novo.</div>');
  }
}

/* ========================================================
   DEFINIÇÕES · CÓPIA DE SEGURANÇA (exportar / importar)
   Os terrenos vivem no localStorage deste navegador: limpar a cache apaga-os. O backup é um ficheiro .json.
   ======================================================== */
const LAST_BACKUP_KEY = 'terrenos.lastBackup';
const backupData = () => ({ app: 'terrenos', version: 1, exportedAt: new Date().toISOString(), props, groups, folders: subfolders });
const marcarBackup = () => { try { localStorage.setItem(LAST_BACKUP_KEY, new Date().toISOString()); } catch (_) {} };

async function exportBackup() {
  const nome = `terrenos-backup-${new Date().toISOString().slice(0, 10)}.json`;
  const file = new File([JSON.stringify(backupData(), null, 1)], nome, { type: 'application/json' });
  try {   // no telemóvel abre a folha de partilha (Drive, WhatsApp, e-mail…)
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({ files: [file], title: 'Backup dos terrenos' });
      marcarBackup(); hideModal(); return toast('Backup partilhado');
    }
  } catch (err) { if (err.name === 'AbortError') return; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(file); a.download = nome;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  marcarBackup(); hideModal(); toast('Backup descarregado');
}

function validateBackup(d) {
  if (!d || d.app !== 'terrenos' || !Array.isArray(d.props)) throw new Error('não é um backup desta aplicação');
  const poligono = g => g && ['Polygon', 'MultiPolygon', 'LineString', 'MultiLineString'].includes(g.type) && Array.isArray(g.coordinates);
  return {
    props:   d.props.filter(p => p && typeof p.id === 'string' && typeof p.name === 'string' && p.geojson && poligono(p.geojson.geometry)),
    groups:  (d.groups  || []).filter(g => g && g.id && g.name),
    folders: (d.folders || []).filter(f => f && f.id && f.name && f.group_id),
  };
}
function applyImport(d, modo) {
  clearVertices(); deselectProperty(); clearIdentify(); selected.clear();
  if (modo === 'substituir') { props = []; groups = []; subfolders = []; }
  const ids = new Set(props.map(p => p.id)); let novas = 0;
  d.props.forEach(p => { if (!ids.has(p.id)) { props.push(p); ids.add(p.id); novas++; } });
  d.groups.forEach(g => { if (!groups.some(x => x.id === g.id)) groups.push({ id: g.id, name: g.name }); });
  d.folders.forEach(f => { if (!subfolders.some(x => x.id === f.id)) subfolders.push({ id: f.id, name: f.name, group_id: f.group_id }); });
  props.forEach(p => {   // coerência dos grupos/pastas
    if (!groups.some(g => g.id === p.group_id)) { p.group_id = null; p.folder_id = null; }
    else if (p.folder_id && !subfolders.some(f => f.id === p.folder_id && f.group_id === p.group_id)) p.folder_id = null;
  });
  myLayer.clearLayers(); Object.keys(layersById).forEach(k => delete layersById[k]);
  props.forEach(addToMap);
  save(); saveGroups(); openGroupId = null; openFolderId = null; renderList(); hideModal();
  if (props.length) map.fitBounds(myLayer.getBounds(), { padding: [40, 40], maxZoom: 17 });
  const ignoradas = d.props.length - novas;
  toast(modo === 'substituir' ? `Backup restaurado: ${props.length} itens` : `${novas} novos itens adicionados` + (ignoradas ? ` · ${ignoradas} já existiam` : ''));
}
function escolherFicheiro(direto = false) {   // direto = junta (merge) sem perguntar
  const inp = document.createElement('input'); inp.type = 'file'; inp.accept = 'application/json,.json';
  inp.onchange = async () => {
    const f = inp.files[0]; if (!f) return;
    try {
      const d = validateBackup(JSON.parse(await f.text()));
      if (direto) return applyImport(d, 'juntar');
      showModal(`
        <p class="modal-title">⬆️ Importar backup</p>
        <p class="modal-sub">O ficheiro tem <b>${d.props.length}</b> propriedades, ${d.groups.length} grupos e ${d.folders.length} pastas.</p>
        <button id="impJuntar" class="btn-primary">Juntar ao que já tenho</button>
        <button id="impSub" class="btn-ghost" style="border:1.5px solid #e11d48;color:#e11d48">Substituir tudo (apaga o atual)</button>
        <button class="btn-ghost mClose">Cancelar</button>`,
      () => {
        document.getElementById('impJuntar').onclick = () => applyImport(d, 'juntar');
        document.getElementById('impSub').onclick = () => { if (confirm('Isto apaga todas as propriedades atuais e coloca as do ficheiro. Continuar?')) applyImport(d, 'substituir'); };
      });
    } catch (err) { toast('Ficheiro inválido: ' + err.message); }
  };
  inp.click();
}
function openSettings() {
  let last = null; try { last = localStorage.getItem(LAST_BACKUP_KEY); } catch (_) {}
  showModal(`
    <p class="modal-title">⚙ Definições</p>
    <p class="modal-sub">Os terrenos ficam guardados só neste navegador. <b>Limpar a cache ou os dados do site apaga-os.</b> Guarde cópias de segurança fora do telemóvel.</p>
    <div class="sel-summary" style="margin:0 0 12px">${props.length} propriedades · ${groups.length} grupos · ${subfolders.length} pastas<br>Último backup: <b>${last ? new Date(last).toLocaleString('pt-PT') : 'nunca'}</b></div>
    ${jaInstalada() ? '' : `<button id="pwaInstall" class="btn-primary" style="background:var(--gold-dark,#9a6b00);margin-bottom:8px">📲 Instalar no ecrã principal</button>`}
    <details style="margin:0 0 10px;font-size:.78rem"><summary>Diagnóstico da última identificação</summary><pre style="white-space:pre-wrap;margin:6px 0 0">${esc(ultimoDiag.length ? ultimoDiag.join('\n') : 'Ainda não houve identificações.')}</pre></details>
    <button id="bkExport" class="btn-primary">⬇️ Exportar backup</button>
    <button id="bkImport" class="btn-ghost" style="border:1.5px solid #ddd;margin-bottom:6px">⬆️ Importar backup</button>
    <button class="btn-ghost mClose">Fechar</button>`,
  () => {
    document.getElementById('bkExport').onclick = exportBackup; document.getElementById('bkImport').onclick = () => escolherFicheiro();
    const inst = document.getElementById('pwaInstall');
    if (inst) inst.onclick = async () => {
      if (pedidoInstalar) { pedidoInstalar.prompt(); await pedidoInstalar.userChoice; pedidoInstalar = null; hideModal(); return; }
      showModal(`<p class="modal-title">📲 Instalar a aplicação</p>
        <p class="modal-sub"><b>Android (Chrome):</b> menu ⋮ › <i>Instalar aplicação</i> (ou <i>Adicionar ao ecrã principal</i>).<br><br>
        <b>iPhone (Safari):</b> botão Partilhar ⬆️ › <i>Adicionar ao ecrã principal</i>.<br><br>
        A instalação só está disponível quando a página é aberta por HTTPS (por exemplo, GitHub Pages ou Netlify).</p>
        <button class="btn-ghost mClose">Fechar</button>`);
    };
  });
}
document.getElementById('btnSettings').onclick = openSettings;
document.getElementById('btnExport').onclick = exportBackup;
document.getElementById('btnImport').onclick = () => escolherFicheiro(true);
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});   // pede ao navegador para não apagar os dados

/* ========================================================
   PESQUISA DE LOCALIDADES (leaflet-control-geocoder / Nominatim, só Portugal)
   Escrever o nome + Enter: o mapa centra-se no 1.º resultado; os restantes ficam numa lista para escolher.
   Se a biblioteca falhar, pede diretamente ao Nominatim.
   ======================================================== */
const geoMarkers = L.layerGroup().addTo(map);
let geoToken = 0, geoTimer = null;

async function geocode(q) {
  const GC = L.Control && L.Control.Geocoder;
  if (GC && GC.nominatim) {
    try {
      const res = await Promise.race([
        new Promise(ok => GC.nominatim({ serviceUrl: CONFIG.NOMINATIM + '/', geocodingQueryParams: { countrycodes: 'pt', limit: 6, 'accept-language': 'pt' } }).geocode(q, r => ok(r || []))),
        new Promise((_, no) => setTimeout(() => no(new Error('timeout')), 9000)),
      ]);
      if (res.length) return res.map(r => ({ name: r.name, lat: r.center.lat, lng: r.center.lng,
        bounds: r.bbox ? [[r.bbox.getSouth(), r.bbox.getWest()], [r.bbox.getNorth(), r.bbox.getEast()]] : null }));
    } catch (_) { /* usa o pedido direto */ }
  }
  const r = await fetch(CONFIG.NOMINATIM + '/search?' + new URLSearchParams({ q, format: 'jsonv2', countrycodes: 'pt', limit: 6, 'accept-language': 'pt' }),
    { signal: AbortSignal.timeout(15000) });
  if (!r.ok) throw new Error(`Pesquisa indisponível (${r.status}).`);
  return (await r.json()).map(x => ({ name: x.display_name, lat: +x.lat, lng: +x.lon,
    bounds: x.boundingbox ? [[+x.boundingbox[0], +x.boundingbox[2]], [+x.boundingbox[1], +x.boundingbox[3]]] : null }));
}

function goToPlace(r) {
  geoMarkers.clearLayers();
  const curto = r.name.split(',').slice(0, 2).join(',').trim();
  L.marker([r.lat, r.lng], { keyboard: false, icon: L.divIcon({ className: 'geo-pin', html: '📍', iconSize: [30, 30], iconAnchor: [15, 28] }) })
    .bindTooltip(esc(curto), { permanent: true, direction: 'top', className: 'cad-tip', offset: [0, -26], interactive: false }).addTo(geoMarkers);
  r.bounds ? map.fitBounds(r.bounds, { maxZoom: 15, padding: [30, 30] }) : map.setView([r.lat, r.lng], 14);
}

async function searchPlace(q, centrar) {
  const out = document.getElementById('searchResults'), token = ++geoToken;
  q = q.trim();
  if (q.length < 2) { out.innerHTML = ''; return; }
  out.innerHTML = '<li class="sr-msg"><span class="spinner"></span> A procurar…</li>';
  try {
    const res = await geocode(q);
    if (token !== geoToken) return;
    if (!res.length) { out.innerHTML = '<li class="sr-msg">Nenhuma localidade encontrada.</li>'; return; }
    out.innerHTML = res.map((r, i) => {
      const [a, ...resto] = r.name.split(',');
      return `<li><button data-i="${i}"><b>${esc(a)}</b><span>${esc(resto.slice(0, 3).join(',').trim())}</span></button></li>`;
    }).join('');
    out._res = res;
    if (centrar) goToPlace(res[0]);          // centra logo no 1.º resultado
  } catch (err) {
    if (token === geoToken) out.innerHTML = `<li class="sr-msg">Não foi possível pesquisar: ${esc(err.message)}</li>`;
  }
}
function openSearch() {
  document.getElementById('searchBar').classList.add('open');
  const i = document.getElementById('searchInput'); i.focus(); i.select();
}
function closeSearch(limpar) {
  document.getElementById('searchBar').classList.remove('open');
  document.getElementById('searchInput').blur();
  if (limpar) { geoMarkers.clearLayers(); document.getElementById('searchResults').innerHTML = ''; document.getElementById('searchInput').value = ''; }
}
document.getElementById('btnSearch').onclick = openSearch;
document.getElementById('searchClose').onclick = () => closeSearch(true);
document.getElementById('searchGo').onclick = () => searchPlace(document.getElementById('searchInput').value, true);
document.getElementById('searchInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') { clearTimeout(geoTimer); searchPlace(e.target.value, true); e.target.blur(); }
  if (e.key === 'Escape') closeSearch(true);
});
document.getElementById('searchInput').addEventListener('input', e => {      // sugestões enquanto escreve (sem mexer no mapa)
  clearTimeout(geoTimer);
  if (e.target.value.trim().length >= 3) geoTimer = setTimeout(() => searchPlace(e.target.value, false), 900);
});
document.getElementById('searchResults').addEventListener('click', e => {
  const b = e.target.closest('button[data-i]'); if (!b) return;
  goToPlace(document.getElementById('searchResults')._res[+b.dataset.i]);
  closeSearch(false);                         // fecha a barra e deixa o marcador no local
});
map.on('click', () => closeSearch(false));

/* ========================================================
   UI HELPERS
   ======================================================== */
function openSheet()  { renderList(); document.getElementById('sheet').classList.add('open'); }
function closeSheet() { document.getElementById('sheet').classList.remove('open'); }
document.getElementById('btnList').onclick    = openSheet;
document.getElementById('sheetClose').onclick = closeSheet;
map.on('click', e => {
  if (document.getElementById('sheet').classList.contains('open')) closeSheet();
  if (drawHandler) return;                // a desenhar: os toques são vértices
  if (!vtxState) deselectProperty();      // toque no vazio: tira o destaque (mantém-no enquanto o painel de vértices está aberto)
  clearTimeout(idTimer);
  if (map.hasLayer(wms) || map.hasLayer(malhaVet)) idTimer = setTimeout(() => identifyAt(e.latlng), 260);   // malha DGT ativa: identifica (só consulta); o atraso evita disparar num duplo toque
  else clearIdentify();
});
map.on('dblclick zoomstart movestart', () => clearTimeout(idTimer));

function showModal(html, afterFn) {
  const body=document.getElementById('modalBody'), modal=document.getElementById('modal');
  body.innerHTML = html;
  modal.classList.add('open');
  body.querySelectorAll('.mClose').forEach(b => b.onclick=hideModal);
  if (afterFn) afterFn();
}
function hideModal() { document.getElementById('modal').classList.remove('open'); }
document.getElementById('modal').addEventListener('click', e => {
  if (e.target === document.getElementById('modal')) hideModal();
});

function showErr(msg) {
  const el = document.getElementById('fErr');
  if (!el) return; el.textContent = msg; el.style.display = 'block';
}
function clearErr() {
  const el = document.getElementById('fErr');
  if (el) { el.textContent=''; el.style.display='none'; }
}

let toastTimer;
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.style.display = 'block';
  clearTimeout(toastTimer); toastTimer = setTimeout(()=>{ t.style.display='none'; }, 3200);
}

function esc(s) {
  return String(s??'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ========================================================
   PWA: instalação no telemóvel (manifest.json + sw.js na mesma pasta do index.html)
   ======================================================== */
if ('serviceWorker' in navigator && (location.protocol === 'https:' || ['localhost', '127.0.0.1'].includes(location.hostname))) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(err => console.warn('Service worker:', err)));
}
let pedidoInstalar = null;     // evento do Chrome/Edge/Android que permite o botão "Instalar"
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); pedidoInstalar = e; });
window.addEventListener('appinstalled', () => { pedidoInstalar = null; toast('Aplicação instalada 🌲'); });
const jaInstalada = () => matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
</script>
